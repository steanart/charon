[package]
name = "charon-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["stean.ART"]
description = "Sync engine for Charon: scans two folders, plans the crossing and carries files over safely"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
globset = "0.4"
log = "0.4"
notify = "8"
plist = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
